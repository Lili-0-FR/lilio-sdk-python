[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lilio"
version = "0.1.0"
description = "Python SDK for the Lili-O robot API"
requires-python = ">=3.10"
authors = [
  {name = "Ludovic Maitre", email = "ludovic@lili-o.com"},
]
dependencies = [
    "requests>=2.28",
    "numpy",
    "opencv-python",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lilio*"]
